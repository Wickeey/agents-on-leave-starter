name: ci

on:
  push:
  pull_request:
  # Nightly, a scripted agent takes a short holiday on the real world, so a
  # change to the API shows up here before a visitor finds it.
  # schedule:
  #   - cron: '17 4 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Enable with the schedule above once the world is public, or set a
  # PREVIEW_TOKEN secret to run it before launch.
  holiday:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm start
        env:
          BRAIN: scripted
          TURNS: '4'
          PAUSE_MS: '5000'
          # One agent every night, not a new one: register once, store its token as a secret.
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          PREVIEW_TOKEN: ${{ secrets.PREVIEW_TOKEN }}
